name: Captura diaria de precios

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      probar:
        description: "Solo comprobar benchmarks y vehiculos pendientes (no guarda nada)"
        type: boolean
        default: false

permissions:
  contents: write

# Mismo grupo que «Comparar fuentes»: nunca suben cambios a la vez.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar benchmarks y vehiculos pendientes (modo --probar, no guarda nada)
        if: ${{ inputs.probar }}
        run: |
          python3 fetch_precios_publico.py --probar | tee probar.txt
          { echo '```'; cat probar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar captura de precios
        if: ${{ !inputs.probar }}
        run: python3 fetch_precios_publico.py

      - name: Commitear el snapshot del dia
        if: ${{ !inputs.probar }}
        run: |
          git config user.name "cartera-precios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add precios/ crudo/
          git diff --staged --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Precios $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done
          exit 1
