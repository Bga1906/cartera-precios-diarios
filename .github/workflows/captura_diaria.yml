name: Captura diaria de precios

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar captura de precios
        run: python3 fetch_precios_publico.py

      - name: Commitear el snapshot del dia
        run: |
          git config user.name "cartera-precios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add precios/
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "Precios $(date -u +%Y-%m-%d)"
          git push
