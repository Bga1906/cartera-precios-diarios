name: Captura secundaria de Google

# Lee el CSV publicado del Sheet «Precios secundaria» y lo anota en crudo/ (origen=google).
# Corre aparte de la captura de las 20:00 UTC, que no se toca.
on:
  schedule:
    - cron: "30 22 * * *"   # despues del cierre de EE. UU. (la foto nocturna de Google se hace a las 23:00 de Madrid)
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la captura de Google y anotarla en el crudo
        run: python3 google_lector.py

      - name: Commitear el crudo
        run: |
          git config user.name "cartera-precios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crudo/ latido_google.json
          git diff --staged --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Crudo Google $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done
          exit 1
